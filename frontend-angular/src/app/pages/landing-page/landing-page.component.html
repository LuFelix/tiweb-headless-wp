<main class="min-h-screen">
  @if (!showManualLogin()) {
    <app-hero (toggleLoginForm)="onEnterManual()" />
    <app-ecosystem-bento />
    <app-engineering-trust />
    <app-about-us-section />
    <app-services-section />
    <app-contact-section />
    <app-footer-section />
  } @else {
    <section class="min-h-screen flex items-center justify-center bg-dracula-background px-4">
      <div class="text-center">
        <router-outlet></router-outlet>
        
        <button 
          class="back-button mt-8 text-sm text-gray-400 hover:text-dracula-purple transition-colors cursor-pointer bg-transparent border-none"
          (click)="showManualLogin.set(false)"
        >
          ← Voltar para a Página Principal
        </button>
      </div>
    </section>
  }
</main>
