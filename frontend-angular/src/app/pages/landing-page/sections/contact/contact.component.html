<section class="contact-section py-20 px-4 bg-dracula-background">
  <div class="container mx-auto max-w-6xl">
    
    <div class="text-center mb-16">
      <h2 class="text-3xl md:text-4xl font-bold mb-4 text-dracula-foreground">
        Entre em <span class="text-dracula-purple">Contato</span>
      </h2>
      <p class="text-lg text-gray-400 max-w-2xl mx-auto">
        Nossa equipe está pronta para atender você
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      
      <div class="contact-info">
        <div class="space-y-8">
          
          <div class="contact-item flex items-start gap-5">
            <div class="icon-wrapper shrink-0 w-12 h-12 rounded-lg bg-dracula-purple/10 flex items-center justify-center">
              <svg class="w-6 h-6 text-dracula-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-dracula-foreground mb-1">E-mail Comercial</h3>
              <p class="text-gray-400">contato&#64;trazom.com.br</p>
            </div>
          </div>

          <div class="contact-item flex items-start gap-5">
            <div class="icon-wrapper shrink-0 w-12 h-12 rounded-lg bg-dracula-cyan/10 flex items-center justify-center">
              <svg class="w-6 h-6 text-dracula-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-semibold text-dracula-foreground mb-1">Telefone</h3>
              <p class="text-gray-400">(11) 99999-9999</p>
            </div>
          </div>

          <div class="mt-12 p-6 bg-dracula-surface/40 rounded-xl border border-dracula-surface">
            <p class="text-gray-300 italic">
              "Atendimento de segunda a sexta-feira, das 08:00 às 18:00. Resposta garantida em até 24 horas úteis."
            </p>
          </div>

        </div>
      </div>

      <div class="contact-form">
        <div class="bg-dracula-surface rounded-xl p-8">
          
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-5">

            <div class="form-group">
              <label class="custom-label block mb-2 text-sm font-medium text-gray-300">Nome Completo</label>
              <input 
                type="text" 
                formControlName="name"
                class="w-full px-4 py-3 rounded-lg bg-dracula-background border border-gray-600 text-dracula-foreground focus:outline-none focus:border-dracula-purple transition-colors"
                placeholder="Digite seu nome"
              >
            </div>

            <div class="form-group">
              <label class="custom-label block mb-2 text-sm font-medium text-gray-300">E-mail</label>
              <input 
                type="email" 
                formControlName="email"
                class="w-full px-4 py-3 rounded-lg bg-dracula-background border border-gray-600 text-dracula-foreground focus:outline-none focus:border-dracula-purple transition-colors"
                placeholder="seu@email.com"
              >
            </div>

            <div class="form-group">
              <label class="custom-label block mb-2 text-sm font-medium text-gray-300">Mensagem</label>
              <textarea 
                formControlName="message"
                rows="4"
                class="w-full px-4 py-3 rounded-lg bg-dracula-background border border-gray-600 text-dracula-foreground focus:outline-none focus:border-dracula-purple transition-colors resize-none"
                placeholder="Escreva sua mensagem aqui..."
              ></textarea>
            </div>

            <button 
              type="submit"
              class="w-full mt-2 py-3 px-6 rounded-lg bg-dracula-purple text-white font-medium hover:bg-dracula-purple/90 transition-colors cursor-pointer"
            >
              Enviar Mensagem
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</section>
