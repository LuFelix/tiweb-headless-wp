<div class="login-container">
  <mat-card class="login-card">
    
    <mat-card-header>
      <mat-card-title>Entrar no Sistema</mat-card-title>
      <mat-card-subtitle>Utilize suas credenciais de acesso</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        @if (loginError) {
          <div class="error-message">
            ⚠️ Usuário ou senha inválidos. Tente novamente.
          </div>
        }

        <div class="form-group">
          <label class="custom-label">Usuário / Email</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="username" type="text" autocomplete="username" placeholder="seu@email.com">
          </mat-form-field>
        </div>

        <div class="form-group">
          <label class="custom-label">Senha</label>
          <mat-form-field appearance="outline" class="w-full">
            <input matInput formControlName="password" type="password" autocomplete="current-password" placeholder="••••••••">
          </mat-form-field>
        </div>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="login-button w-full"
          [disabled]="isLoading || loginForm.invalid"
        >
          @if (isLoading) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            ENTRAR
          }
        </button>

      </form>
    </mat-card-content>

    <div class="login-footer">
      <a href="#" class="register-link">
        Não tem conta? <span>Cadastre-se aqui</span>
      </a>
    </div>

  </mat-card>
</div>
