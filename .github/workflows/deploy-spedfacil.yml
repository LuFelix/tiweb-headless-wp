name: 🚀 Deploy SPED Fácil (HostGator via FTP)

on:
  workflow_dispatch:

concurrency:
  group: production-ftp-deploy-spedfacil
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Build & FTP Deploy (SPED Fácil Angular)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: 📦 Instalar Dependências (Angular)
        working-directory: ./frontend-angular
        run: npm ci

      - name: 🏗️ Compilar Aplicação Angular
        working-directory: ./frontend-angular
        env:
          NG_PERSISTENT_BUILD_CACHE: "0"
        run: npm run build

      - name: 🚀 Sincronizar Arquivos via FTP para Subpasta do Subdomínio
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend-angular/dist/frontend-tiweb/browser/
          server-dir: ${{ secrets.FTP_SPEDFACIL_DIR || './spedfacil/' }}
          dangerous-clean-slate: false
