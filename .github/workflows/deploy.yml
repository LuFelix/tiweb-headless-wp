name: 🚀 Deploy Produção (HostGator via FTP)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 🌐 Build & FTP Deploy (HostGator)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: 📦 Instalar Dependências (Frontend)
        working-directory: ./frontend-angular
        run: npm ci

      - name: 🏗️ Compilar Aplicação Angular (Build Estático)
        working-directory: ./frontend-angular
        env:
          NG_PERSISTENT_BUILD_CACHE: "0"
        run: npm run build

      - name: 🚀 Sincronizar Arquivos via FTP para Hospedagem
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend-angular/dist/frontend-tiweb/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false

      - name: 🩺 Smoke Test HTTP Pós-Deploy
        env:
          SITE_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "Verificando disponibilidade em $SITE_URL..."
            for i in {1..6}; do
              if curl --fail --silent --show-error "$SITE_URL" > /dev/null; then
                echo "✓ Site respondendo com sucesso 200 OK (tentativa $i/6)."
                exit 0
              fi
              echo "Aguardando propagação ($i/6)..."
              sleep 5
            done
            echo "❌ Falha no smoke test pós-deploy!"
            exit 1
          else
            echo "ℹ️  HEALTHCHECK_URL não configurada; smoke test externo ignorado."
          fi
