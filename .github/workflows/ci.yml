name: CI

on:
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Validação e Build do Frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: 📦 Instalar Dependências (Frontend)
        working-directory: ./frontend-angular
        run: npm ci

      - name: 🏗️ Compilar Aplicação Angular (Build de Produção)
        working-directory: ./frontend-angular
        run: npm run build
